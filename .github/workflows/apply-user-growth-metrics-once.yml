name: Apply user growth metrics once

on:
  push:
    branches:
      - feat/user-growth-metrics

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: bootstrap user growth metrics'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/user-growth-metrics
          fetch-depth: 0

      - name: Apply focused patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('src/lib/services/userGrowthService.ts')
          service.write_text("""/**
           * Métricas internas de crecimiento de cuentas registradas.
           *
           * `profiles` tiene RLS: una cuenta normal solo puede leer su propia fila,
           * mientras moderación/administración puede leer el conjunto. Esta función
           * se usa únicamente desde `/moderacion`; RLS sigue siendo la barrera real.
           */
          import { supabase } from '$lib/supabase/client';

          export interface RegisteredUserStats {
          \ttotal: number;
          \tlast24h: number;
          \tlast7d: number;
          }

          async function countProfilesSince(since?: string): Promise<number> {
          \tlet query = supabase.from('profiles').select('id', { count: 'exact', head: true });
          \tif (since) query = query.gte('created_at', since);
          \tconst { count, error } = await query;
          \tif (error) throw error;
          \treturn count ?? 0;
          }

          export async function getRegisteredUserStats(): Promise<RegisteredUserStats> {
          \tconst now = Date.now();
          \tconst [total, last24h, last7d] = await Promise.all([
          \t\tcountProfilesSince(),
          \t\tcountProfilesSince(new Date(now - 24 * 60 * 60 * 1000).toISOString()),
          \t\tcountProfilesSince(new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString())
          \t]);
          \treturn { total, last24h, last7d };
          }
          """, encoding='utf-8')

          page_ts = Path('src/routes/moderacion/+page.ts')
          text = page_ts.read_text(encoding='utf-8')
          anchor = "import { listReportedMunicipalPetitions } from '$lib/services/municipalService';\n"
          replacement = anchor + "import { getRegisteredUserStats } from '$lib/services/userGrowthService';\n"
          if anchor not in text:
              raise SystemExit('missing import anchor in +page.ts')
          text = text.replace(anchor, replacement, 1)

          old = """\tconst [participantCountResult, openVoiceTotalResult, recentAuditTrailResult] =
          \t\tawait Promise.allSettled([
          \t\t\tgetPulsoParticipantCount(),
          \t\t\tcountActiveOpenVoiceContributions(),
          \t\t\tlistRecentAuditTrail(8)
          \t\t]);
          """
          new = """\tconst [
          \t\tparticipantCountResult,
          \t\topenVoiceTotalResult,
          \t\trecentAuditTrailResult,
          \t\tregisteredUserStatsResult
          \t] = await Promise.allSettled([
          \t\tgetPulsoParticipantCount(),
          \t\tcountActiveOpenVoiceContributions(),
          \t\tlistRecentAuditTrail(8),
          \t\tgetRegisteredUserStats()
          \t]);
          """
          if old not in text:
              raise SystemExit('missing Promise.allSettled anchor in +page.ts')
          text = text.replace(old, new, 1)

          anchor = """\tconst recentAuditTrail =
          \t\trecentAuditTrailResult.status === 'fulfilled' ? recentAuditTrailResult.value : null;
          """
          replacement = anchor + """\tconst registeredUserStats =
          \t\tregisteredUserStatsResult.status === 'fulfilled' ? registeredUserStatsResult.value : null;
          """
          if anchor not in text:
              raise SystemExit('missing result anchor in +page.ts')
          text = text.replace(anchor, replacement, 1)

          anchor = "\t\trecentAuditTrail,\n\t\tactiveVoteRound,\n"
          replacement = "\t\trecentAuditTrail,\n\t\tregisteredUserStats,\n\t\tactiveVoteRound,\n"
          if anchor not in text:
              raise SystemExit('missing return anchor in +page.ts')
          text = text.replace(anchor, replacement, 1)
          page_ts.write_text(text, encoding='utf-8')

          page_svelte = Path('src/routes/moderacion/+page.svelte')
          text = page_svelte.read_text(encoding='utf-8')
          anchor = "\tconst activeVoteTotal = data.activeVoteTotal;\n"
          replacement = anchor + "\tconst registeredUserStats = data.registeredUserStats;\n"
          if anchor not in text:
              raise SystemExit('missing data anchor in +page.svelte')
          text = text.replace(anchor, replacement, 1)

          anchor = "\tconst summaryCards = $derived<SummaryCard[]>([\n\t\t{ label: 'Personas participantes únicas', value: participantCount },\n"
          replacement = """\tconst summaryCards = $derived<SummaryCard[]>([
          \t\t{ label: 'Usuarios registrados totales', value: registeredUserStats?.total ?? null },
          \t\t{ label: 'Nuevos registros · últimas 24 h', value: registeredUserStats?.last24h ?? null },
          \t\t{ label: 'Nuevos registros · últimos 7 días', value: registeredUserStats?.last7d ?? null },
          \t\t{ label: 'Personas participantes únicas', value: participantCount },
          """
          if anchor not in text:
              raise SystemExit('missing summaryCards anchor in +page.svelte')
          text = text.replace(anchor, replacement, 1)
          page_svelte.write_text(text, encoding='utf-8')
          PY

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format touched files
        run: pnpm exec prettier --write src/lib/services/userGrowthService.ts src/routes/moderacion/+page.ts src/routes/moderacion/+page.svelte

      - name: Type and Svelte checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-user-growth-metrics-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/services/userGrowthService.ts src/routes/moderacion/+page.ts src/routes/moderacion/+page.svelte .github/workflows/apply-user-growth-metrics-once.yml
          git commit -m "feat(moderation): show registered user growth metrics"
          git push origin HEAD:feat/user-growth-metrics
