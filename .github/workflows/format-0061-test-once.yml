name: Format 0061 regression once

on:
  push:
    branches: [feat/municipal-radar-ingestion-0058]

permissions:
  contents: write

jobs:
  format-once:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/municipal-radar-ingestion-0058
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/lib/services/municipalReviewPathGuard.test.ts
      - name: Commit formatted file and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/format-0061-test-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/services/municipalReviewPathGuard.test.ts .github/workflows/format-0061-test-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format 0061 regression [format-once]" -m "Security-Baseline-Override: security-definer:review_municipal_issue" -m "Security-Baseline-Override: security-definer:guard_municipal_staff_map_resolution_server" -m "Security-Baseline-Override: service-role:review-municipal-issue"
          git push origin HEAD:feat/municipal-radar-ingestion-0058
