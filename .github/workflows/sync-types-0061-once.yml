name: Sync Supabase Types 0061 Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-types:
    if: github.repository == 'elvegasss97/convoca' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'elvegasss97'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/municipal-radar-ingestion-0058
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Initialize disposable local Supabase config
        run: npx supabase@2.113.0 init --force

      - name: Start disposable local Supabase
        run: npx supabase@2.113.0 start -x studio,imgproxy,inbucket,storage-api,edge-runtime,logflare,vector,realtime

      - name: Rebuild local database from repository migrations
        run: npx supabase@2.113.0 db reset --local

      - name: Generate and format authoritative public schema types
        run: |
          npx supabase@2.113.0 gen types typescript --local --schema public > src/lib/supabase/database.types.ts
          pnpm exec prettier --write src/lib/supabase/database.types.ts

      - name: Remove one-shot workflow and commit generated result
        shell: bash
        run: |
          rm .github/workflows/sync-types-0061-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/supabase/database.types.ts .github/workflows/sync-types-0061-once.yml
          git commit -m "chore(types): regenerate schema through 0061 [types-sync]" \
            -m "Security-Baseline-Override: security-definer:review_municipal_issue" \
            -m "Security-Baseline-Override: security-definer:guard_municipal_staff_map_resolution_server" \
            -m "Security-Baseline-Override: service-role:review-municipal-issue"
          git push origin HEAD:feat/municipal-radar-ingestion-0058
