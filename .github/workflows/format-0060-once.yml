name: Format 0060 Files Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'elvegasss97/convoca' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'elvegasss97'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/municipal-radar-ingestion-0058
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only 0060 generated/test files
        run: pnpm exec prettier --write -- src/lib/services/municipalReviewPathGuard.test.ts src/lib/supabase/database.types.ts

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/format-0060-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/services/municipalReviewPathGuard.test.ts src/lib/supabase/database.types.ts .github/workflows/format-0060-once.yml
          git commit -m "style: format 0060 generated and regression files [format-once]" \
            -m "Security-Baseline-Override: security-definer:review_municipal_issue" \
            -m "Security-Baseline-Override: security-definer:guard_municipal_staff_map_resolution_server" \
            -m "Security-Baseline-Override: service-role:review-municipal-issue"
          git push origin HEAD:feat/municipal-radar-ingestion-0058
