name: PR Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: check-lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLIC_SUPABASE_URL: https://tu-proyecto-ficticio.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_valor_ficticio_de_ejemplo
      PUBLIC_APP_ENV: test
      PUBLIC_AUTH_GOOGLE_ENABLED: 'false'
      PUBLIC_AUTH_PASSWORD_ENABLED: 'true'
      PUBLIC_ENABLE_DEMO_DATA: 'false'
      PUBLIC_ENABLE_DEV_TOOLS: 'false'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply and format Ceuta responsive fix once
        if: github.actor != 'github-actions[bot]'
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- src/app.html
          python - <<'PY'
          from pathlib import Path

          calendario = Path('src/lib/components/pulso/CalendarioVisual.svelte')
          text = calendario.read_text()
          start = text.index('\tfunction phaseShortLabel(phase: TopicTimelinePhase): string {')
          end = text.index('\n\n\t// Etiquetas de tono', start)
          replacement = """\tfunction phaseShortLabel(phase: TopicTimelinePhase): string {
          \tif (/100\\s*d[ií]as/i.test(phase.title)) return '100 días';

          \tconst dayRange = phase.title.match(/\\bd[ií]as\\s+(\\d+)\\s+a\\s+(\\d+)\\b/i);
          \tif (dayRange) return `${dayRange[1]}–${dayRange[2]} días`;

          \tconst monthRange = phase.title.match(/\\bmeses\\s+(\\d+)\\s+a\\s+(\\d+)\\b/i);
          \tif (monthRange) return `${monthRange[1]}–${monthRange[2]} meses`;

          \tconst firstHours = phase.title.match(/\\bprimer(?:as|os)\\s+(\\d+)\\s+horas\\b/i);
          \tif (firstHours) return `${firstHours[1]} h`;

          \tconst firstDays = phase.title.match(/\\bprimer(?:as|os)\\s+(\\d+)\\s+d[ií]as\\b/i);
          \tif (firstDays) return `${firstDays[1]} días`;

          \tconst years = [...phase.title.matchAll(/\\b(20\\d{2})\\b/g)].map((m) => m[1]);
          \tif (years.length >= 2) {
          \t\tconst first = years[0];
          \t\tconst last = years[years.length - 1];
          \t\treturn `${first}–${last.slice(-2)}`;
          \t}
          \tif (years.length === 1) return years[0];
          \treturn phase.title;
          }"""
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              'style="grid-template-columns: repeat({phases.length}, 1fr);"',
              'style="grid-template-columns: repeat({phases.length}, minmax(0, 1fr));"',
              1,
          )
          text = text.replace(
              'class="flex flex-col items-center gap-2 focus-visible:outline-none"',
              'class="flex min-w-0 flex-col items-center gap-2 focus-visible:outline-none"',
              1,
          )
          text = text.replace(
              'class="text-center text-xs font-bold whitespace-nowrap"',
              'class="min-w-0 text-center text-[10px] leading-tight font-bold break-words sm:text-xs"',
              1,
          )
          calendario.write_text(text)

          distribution = Path('src/lib/components/pulso/PhaseStatusDistribution.svelte')
          text = distribution.read_text()
          text = text.replace(
              'style="grid-template-columns: repeat({phases.length}, 1fr);"',
              'style="grid-template-columns: repeat({phases.length}, minmax(0, 1fr));"',
              1,
          )
          text = text.replace('class="group text-center"', 'class="group min-w-0 text-center"', 1)
          text = text.replace(
              'class="mb-2 text-xs font-bold"',
              'class="mb-2 break-words text-xs leading-tight font-bold"',
              1,
          )
          distribution.write_text(text)
          PY
          pnpm exec prettier --write \
            src/app.html \
            src/lib/components/pulso/CalendarioVisual.svelte \
            src/lib/components/pulso/PhaseStatusDistribution.svelte
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.html src/lib/components/pulso/CalendarioVisual.svelte src/lib/components/pulso/PhaseStatusDistribution.svelte
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix(ceuta): contain mobile calendar without page overflow"
            git push origin HEAD:fix/ceuta-mobile-overflow
          fi

      - name: Type and Svelte check
        run: pnpm check

      - name: Prettier and ESLint on PR diff
        shell: bash
        run: |
          base_ref="${GITHUB_BASE_REF:-main}"
          git fetch origin "$base_ref" --quiet
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "origin/$base_ref...HEAD")

          format_files=()
          eslint_files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.ts|*.svelte|*.mjs|*.js|*.jsx|*.json|*.yml|*.yaml|*.md|*.css|*.html)
                format_files+=("$file")
                ;;
            esac
            case "$file" in
              *.ts|*.svelte|*.mjs|*.js|*.jsx)
                eslint_files+=("$file")
                ;;
            esac
          done

          if ((${#format_files[@]})); then
            pnpm exec prettier --check -- "${format_files[@]}"
          fi
          if ((${#eslint_files[@]})); then
            pnpm exec eslint -- "${eslint_files[@]}"
          fi

      - name: Unit tests
        run: pnpm test