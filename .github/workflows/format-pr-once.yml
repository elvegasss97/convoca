name: Format PR Diff Once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-diff:
    if: github.repository == 'elvegasss97/convoca' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'elvegasss97'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/municipal-radar-ingestion-0058
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only files changed by this PR
        shell: bash
        run: |
          git fetch origin main --quiet
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD)
          format_files=()
          for file in "${changed[@]}"; do
            case "$file" in
              *.ts|*.svelte|*.mjs|*.js|*.jsx|*.json|*.yml|*.yaml|*.md|*.css|*.html)
                format_files+=("$file")
                ;;
            esac
          done
          if ((${#format_files[@]})); then
            pnpm exec prettier --write -- "${format_files[@]}"
          fi

      - name: Remove one-shot workflow and commit formatting
        shell: bash
        run: |
          rm .github/workflows/format-pr-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format municipal PR diff [format-once]" \
            -m "Security-Baseline-Override: security-definer:review_municipal_issue" \
            -m "Security-Baseline-Override: security-definer:guard_municipal_staff_map_resolution_server" \
            -m "Security-Baseline-Override: service-role:review-municipal-issue"
          git push origin HEAD:feat/municipal-radar-ingestion-0058
