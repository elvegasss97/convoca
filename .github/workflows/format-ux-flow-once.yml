name: Format UX flow checkpoint once

on:
  push:
    branches:
      - ux/flow-navigation-checkpoint

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: ux/flow-navigation-checkpoint
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format checkpoint files
        run: |
          pnpm exec prettier --write \
            src/lib/components/pulso/SanidadListeningFlow.svelte \
            src/lib/components/pulso/ViviendaListeningFlow.svelte \
            src/lib/components/pulso/NextBlockVoteFlow.svelte \
            src/lib/utils/flowNavigation.ts

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/components/pulso/SanidadListeningFlow.svelte \
                  src/lib/components/pulso/ViviendaListeningFlow.svelte \
                  src/lib/components/pulso/NextBlockVoteFlow.svelte \
                  src/lib/utils/flowNavigation.ts
          git commit -m "style(ux): format flow navigation checkpoint [format-once]"
          git push origin HEAD:ux/flow-navigation-checkpoint
